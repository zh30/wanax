name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS dropped 2026-11-10 to cut Actions cost. Linux already runs
        # fmt/build/test/clippy and the release-size check. Darwin binaries
        # are built by release.yml on v* tags.
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - run: rustc --version
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: matrix.os == 'ubuntu-24.04'
        run: cargo build --locked --release -p wanax-cli
      - name: NFR-6 release binary under 20MB
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 - <<'PY'
          import os, sys
          path = "target/release/wanax"
          size = os.path.getsize(path)
          print(f"wanax release size: {size} bytes ({size / 1024 / 1024:.2f} MiB)")
          sys.exit(0 if size < 20 * 1024 * 1024 else 1)
          PY
